<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Zseb ("pocket"): three coins in the bucket colours, sized 50 / 30 / 20, tucked into a pocket.
       Full-bleed square; iOS rounds the corners. Content stays inside the maskable safe zone. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- coins: fixed costs (largest), well-being, investment (smallest) -->
  <g stroke-width="8">
    <circle cx="196" cy="196" r="66" fill="#3b82f6" stroke="#1d4ed8" />
    <circle cx="196" cy="196" r="44" fill="none" stroke="#93c5fd" stroke-width="5" opacity="0.7" />
    <circle cx="322" cy="200" r="52" fill="#22c55e" stroke="#15803d" />
    <circle cx="322" cy="200" r="33" fill="none" stroke="#86efac" stroke-width="5" opacity="0.7" />
    <circle cx="262" cy="140" r="40" fill="#f59e0b" stroke="#b45309" />
    <circle cx="262" cy="140" r="24" fill="none" stroke="#fcd34d" stroke-width="5" opacity="0.7" />
  </g>

  <!-- pocket -->
  <path
    d="M112 222 Q256 242 400 222 L400 350 Q400 370 382 379 L272 428 Q256 435 240 428 L130 379 Q112 370 112 350 Z"
    fill="url(#pocket)"
  />
  <path
    d="M134 246 Q256 263 378 246 L378 343 Q378 356 366 362 L266 406 Q256 411 246 406 L146 362 Q134 356 134 343 Z"
    fill="none"
    stroke="#94a3b8"
    stroke-width="5"
    stroke-dasharray="12 9"
    stroke-linecap="round"
  />
  <circle cx="128" cy="236" r="7" fill="#64748b" />
  <circle cx="384" cy="236" r="7" fill="#64748b" />
</svg>
